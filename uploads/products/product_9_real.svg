<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="bottleBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="20%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  
  <g filter="url(#dropShadow)" transform="translate(140, 40)">
    <!-- Bottle Cap -->
    <rect x="50" y="20" width="120" height="35" rx="5" fill="url(#capGrad)"/>
    <rect x="45" y="55" width="130" height="15" rx="3" fill="#b45309"/>
    <!-- Cap Ridges -->
    <path d="M 60 20 L 60 55 M 75 20 L 75 55 M 90 20 L 90 55 M 105 20 L 105 55 M 120 20 L 120 55 M 135 20 L 135 55 M 150 20 L 150 55 M 160 20 L 160 55" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    
    <!-- Bottle Neck -->
    <path d="M 60 70 L 60 95 Q 60 110 30 130 L 30 390 Q 30 410 50 410 L 170 410 Q 190 410 190 390 L 190 130 Q 160 110 160 95 L 160 70 Z" fill="url(#bottleBody)"/>
    
    <!-- Label -->
    <rect x="31" y="145" width="158" height="235" rx="4" fill="url(#labelGrad)"/>
    
    <!-- Label Header Accent -->
    <rect x="31" y="145" width="158" height="12" fill="url(#orangeAccent)"/>
    
    <!-- Fish Icon & Rx Symbol -->
    <circle cx="110" cy="195" r="24" fill="#ffffff" opacity="0.95"/>
    <path d="M 98 195 Q 110 183 122 195 Q 110 207 98 195 Z" fill="#0284c7"/>
    <circle cx="118" cy="191" r="2.5" fill="#ffffff"/>
    
    <!-- Product Text -->
    <text x="110" y="240" font-family="Arial, sans-serif" font-weight="900" font-size="15" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">FISH VITAMIN C</text>
    <text x="110" y="258" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#fbbf24" text-anchor="middle">PLUS</text>
    
    <!-- Subtitle -->
    <rect x="45" y="270" width="130" height="20" rx="10" fill="url(#orangeAccent)"/>
    <text x="110" y="284" font-family="Arial, sans-serif" font-weight="700" font-size="9" fill="#ffffff" text-anchor="middle">IMMUNITY BOOSTER</text>
    
    <!-- Specs -->
    <text x="110" y="315" font-family="Arial, sans-serif" font-size="9" fill="#e0f2fe" text-anchor="middle">Aquaculture Feed Additive</text>
    <text x="110" y="330" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">Net Vol: 500 ml</text>
    <text x="110" y="355" font-family="Arial, sans-serif" font-size="8" fill="#93c5fd" text-anchor="middle">★ Premium Veterinary Grade ★</text>
    
    <!-- Bottle Highlight Reflection -->
    <path d="M 38 135 L 50 135 L 50 395 L 38 395 Z" fill="#ffffff" opacity="0.35"/>
  </g>
</svg>