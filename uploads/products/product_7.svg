<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad_7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="pkgGrad_7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.90" />
    </linearGradient>
    <filter id="shadow_7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <filter id="glow_7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bgGrad_7)" />
  
  <!-- Subtle Background Pattern -->
  <circle cx="720" cy="80" r="220" fill="#ffffff" fill-opacity="0.06" />
  <circle cx="80" cy="420" r="260" fill="#ffffff" fill-opacity="0.04" />
  <path d="M0 400 Q 250 340 500 400 T 800 370 L 800 500 L 0 500 Z" fill="#ffffff" fill-opacity="0.07" />

  <!-- Fish Silhouettes Ambient -->
  <path d="M620 120 Q 640 110 660 120 Q 670 125 660 130 Q 640 140 620 130 Z M660 125 L675 118 L672 132 Z" fill="#ffffff" fill-opacity="0.12" />
  <path d="M120 360 Q 140 350 160 360 Q 170 365 160 370 Q 140 380 120 370 Z M160 365 L175 358 L172 372 Z" fill="#ffffff" fill-opacity="0.12" />

  <!-- Center Product Card Container -->
  <g filter="url(#shadow_7)">
    <!-- Main 3D Bottle/Package Frame -->
    <rect x="220" y="45" width="360" height="410" rx="28" fill="url(#pkgGrad_7)" stroke="#ffffff" stroke-width="2.5" />
    
    <!-- Top Cap / Lid -->
    <rect x="330" y="25" width="140" height="28" rx="8" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
    <rect x="345" y="18" width="110" height="10" rx="4" fill="#38bdf8" />
    
    <!-- Package Header Banner -->
    <path d="M220 110 L580 110 L580 190 L220 190 Z" fill="url(#bgGrad_7)" />
    
    <!-- Category Badge Pill -->
    <rect x="310" y="65" width="180" height="30" rx="15" fill="#ffffff" fill-opacity="0.9" filter="url(#glow_7)" />
    <text x="400" y="85" font-family="'Noto Sans Bengali', 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#0284c7" text-anchor="middle">পানি শোধন</text>

    <!-- Product Title in Bengali -->
    <text x="400" y="148" font-family="'Noto Sans Bengali', 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">অ্যালগি কন্ট্রোল প্লাস</text>
    <text x="400" y="175" font-family="'Noto Sans Bengali', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e0f2fe" text-anchor="middle">Pure Water Algaecide 1L</text>

    <!-- Center Product Icon Emblem -->
    <circle cx="400" cy="270" r="52" fill="#ffffff" filter="url(#shadow_7)" stroke="#38bdf8" stroke-width="3" />
    <circle cx="400" cy="270" r="45" fill="url(#bgGrad_7)" />
    <g transform="translate(400, 270)">
      <path d="M0 -18 Q 15 0 0 18 Q -15 0 0 -18 Z" fill="#38bdf8"/>
    </g>

    <!-- FarmersBD Premium Quality Seal -->
    <rect x="250" y="345" width="300" height="42" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="400" y="371" font-family="'Noto Sans Bengali', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">FarmersBD Premium Aquaculture</text>
    
    <!-- Bottom Net Content / Guarantee -->
    <rect x="280" y="398" width="240" height="24" rx="12" fill="#0284c7" />
    <text x="400" y="414" font-family="'Noto Sans Bengali', 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">১০০% মানসম্মত ও পরীক্ষিত পণ্য</text>
  </g>
</svg>