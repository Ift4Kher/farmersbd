<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" />

  <g filter="url(#shadow)" transform="translate(30, 20)">
    <!-- Slender Cylindrical Dark Body -->
    <path d="M 120 220 C 160 180 350 170 680 210 C 730 220 730 230 680 240 C 350 270 160 260 120 220 Z" fill="url(#bodyGrad)" />

    <!-- Long Sensory Barbels / Whiskers -->
    <path d="M 125 215 Q 60 180 20 190" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <path d="M 125 220 Q 60 210 20 240" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <path d="M 125 225 Q 70 250 30 290" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eye -->
    <circle cx="160" cy="210" r="9" fill="#f59e0b" />
    <circle cx="160" cy="210" r="5" fill="#0f172a" />
  </g>
</svg>