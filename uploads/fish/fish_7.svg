<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" />

  <g filter="url(#shadow)" transform="translate(30, 20)">
    <!-- Long Dorsal Fin running down back -->
    <path d="M 240 160 L 680 200 L 660 230 Z" fill="#1e293b" opacity="0.8" />

    <!-- Broad Flat Head & Body -->
    <path d="M 110 220 C 150 160 320 160 660 210 C 710 220 710 235 660 245 C 320 280 150 280 110 220 Z" fill="url(#bodyGrad)" />

    <!-- 4 Pairs of Barbels -->
    <path d="M 115 210 Q 50 160 10 170" fill="none" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 115 215 Q 50 200 10 220" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <path d="M 115 225 Q 50 240 10 260" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <path d="M 115 230 Q 60 280 25 310" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eye -->
    <circle cx="160" cy="205" r="10" fill="#f59e0b" />
    <circle cx="160" cy="205" r="5" fill="#0f172a" />
  </g>
</svg>