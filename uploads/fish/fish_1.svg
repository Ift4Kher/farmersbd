<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="backGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#475569" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="finRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Water Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <circle cx="150" cy="100" r="140" fill="#ffffff" fill-opacity="0.05" />
  <circle cx="680" cy="380" r="180" fill="#ffffff" fill-opacity="0.04" />
  <circle cx="120" cy="350" r="12" fill="#ffffff" fill-opacity="0.2" />
  <circle cx="180" cy="220" r="8" fill="#ffffff" fill-opacity="0.25" />
  <circle cx="220" cy="180" r="14" fill="#ffffff" fill-opacity="0.15" />
  <circle cx="700" cy="120" r="18" fill="#ffffff" fill-opacity="0.2" />

  <g filter="url(#shadow)" transform="translate(40, 20)">
    <!-- Tail Fin (Caudal) -->
    <path d="M 600 230 C 650 150 720 120 740 130 C 720 230 730 260 740 330 C 710 320 650 290 600 230 Z" fill="url(#finRed)" opacity="0.9" />

    <!-- Dorsal Fin -->
    <path d="M 320 150 C 370 80 440 90 470 145 Z" fill="url(#finRed)" opacity="0.85" />

    <!-- Pelvic & Anal Fins -->
    <path d="M 380 295 C 420 360 450 350 460 305 Z" fill="url(#finRed)" opacity="0.9" />
    <path d="M 490 285 C 530 350 560 330 560 275 Z" fill="url(#finRed)" opacity="0.85" />

    <!-- Pectoral Fin -->
    <path d="M 230 260 C 270 310 310 310 300 270 Z" fill="url(#finRed)" opacity="0.95" />

    <!-- Main Fish Body (Rui / Rohu) -->
    <path d="M 120 220 C 150 140 320 130 520 170 C 600 190 620 220 600 230 C 580 250 500 300 340 300 C 180 300 130 260 120 220 Z" fill="url(#bodyGrad)" />
    <!-- Back Shading -->
    <path d="M 120 220 C 150 140 320 130 520 170 C 600 190 550 200 350 190 C 220 180 140 210 120 220 Z" fill="url(#backGrad)" opacity="0.65" />

    <!-- Gill Cover -->
    <path d="M 210 175 C 235 200 235 250 210 275" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

    <!-- Scale Pattern Texture -->
    <g opacity="0.25" stroke="#1e293b" stroke-width="1.5" fill="none">
      <path d="M 260 180 Q 275 200 260 220 M 290 175 Q 305 195 290 215 M 320 170 Q 335 190 320 210 M 350 170 Q 365 190 350 210 M 380 175 Q 395 195 380 215 M 410 180 Q 425 200 410 220 M 440 185 Q 455 205 440 225 M 470 190 Q 485 210 470 230 M 500 195 Q 515 215 500 235" />
      <path d="M 275 200 Q 290 220 275 240 M 305 195 Q 320 215 305 235 M 335 190 Q 350 210 335 230 M 365 190 Q 380 210 365 230 M 395 195 Q 410 215 395 235 M 425 200 Q 440 220 425 240 M 455 205 Q 470 225 455 245 M 485 210 Q 500 230 485 250" />
    </g>

    <!-- Lateral Line -->
    <path d="M 220 225 Q 400 230 580 225" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.7" />

    <!-- Eye -->
    <circle cx="165" cy="205" r="14" fill="#f59e0b" />
    <circle cx="165" cy="205" r="8" fill="#0f172a" />
    <circle cx="162" cy="202" r="3" fill="#ffffff" />

    <!-- Mouth -->
    <path d="M 120 220 Q 135 230 145 225" fill="none" stroke="#1e293b" stroke-width="3.5" />
  </g>
</svg>