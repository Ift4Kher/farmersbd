<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="30%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" />

  <g filter="url(#shadow)" transform="translate(30, 20)">
    <!-- Forked Tail -->
    <path d="M 600 220 L 730 130 L 680 220 L 740 310 Z" fill="#334155" opacity="0.9" />

    <!-- Sharp Small Dorsal Fin -->
    <path d="M 340 160 L 370 80 L 400 165 Z" fill="#1e293b" />

    <!-- Sleek Smooth Scaleless Body -->
    <path d="M 110 220 C 160 160 320 140 520 180 C 600 200 610 220 600 225 C 580 240 500 280 340 280 C 180 280 130 260 110 220 Z" fill="url(#bodyGrad)" />

    <!-- Long Whiskers (Barbels) -->
    <path d="M 120 225 Q 70 230 40 260" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
    <path d="M 125 230 Q 75 260 50 300" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eye -->
    <circle cx="160" cy="205" r="11" fill="#f59e0b" />
    <circle cx="160" cy="205" r="6" fill="#0f172a" />
  </g>
</svg>